# WebObsidian behind nginx, embeddable in the Bookmark Hub (see docs/HUB_EMBED.md).
#
# Starting point: an existing TLS server block that puts the whole site behind Basic
# Auth and then tells WebObsidian "already logged in" with the trusted-proxy header
# (snippets/obsidian-proxy-auth.conf). Changes, all marked [hub]:
#   1. `location /` also admits a WebObsidian session opened by the Hub
#      (satisfy any + auth_request). Basic Auth keeps working exactly as before.
#   2. The two sign-in bridge endpoints get their own locations: no Basic Auth (a
#      cross-origin frame cannot show that dialog) and, above all, NO trusted-proxy
#      header — WebObsidian checks the Hub's Origin and signed single-use ticket there.
#   3. X-Frame-Options is no longer added here: WebObsidian sends CSP frame-ancestors
#      itself ('none', or exactly the Hub when WEBOBSIDIAN_HUB_URL is set).
#   4. Script requests without credentials get a plain 401 instead of a Basic Auth
#      challenge, so an expired Hub session inside the frame never pops a login dialog;
#      the app goes back through the Hub instead. Same access decision as before: a
#      request without an Authorization header fails Basic Auth anyway.
#
# Replace: host.acedylan.us / certificate paths / 18787 (HTTP_PORT) / htpasswd path.

# [hub] 4. Basic Auth realm, or "off" for credential-less fetch/XHR (see above).
map "$http_sec_fetch_mode:$http_authorization" $obsidian_basic_realm {
    default                               "Obsidian Web - use your HaloWebUI admin account";
    "~^(?:cors|same-origin|no-cors):$"    off;
}

server {
    listen 3003 ssl http2;
    server_name host.acedylan.us;

    client_max_body_size 100m;

    ssl_certificate /etc/letsencrypt/live/host.acedylan.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/host.acedylan.us/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    auth_basic $obsidian_basic_realm;                                  # [hub] 4 (was a fixed string)
    auth_basic_user_file /etc/nginx/auth/obsidian-halowebui.htpasswd;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # [hub] 3. No X-Frame-Options here: WebObsidian's CSP frame-ancestors decides.

    # (Keep any existing `location ^~ /api/v1/ { ... }` for the Agent API unchanged.)

    # [hub] 2. Bookmark Hub sign-in bridge: the Hub's own page posts a signed,
    # single-use ticket here from inside its frame. WebObsidian checks Origin + ticket.
    location = /auth/hub/sso {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Never "already logged in" here, and no client credentials either.
        proxy_set_header X-WebObsidian-Proxy-Auth "";
        proxy_set_header Authorization "";
        client_max_body_size 16k;
    }

    # [hub] 2. The Hub was locked: end the Hub-opened session in this browser.
    location = /auth/hub/logout {
        auth_basic off;
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WebObsidian-Proxy-Auth "";
        proxy_set_header Authorization "";
        client_max_body_size 1k;
    }

    # [hub] 1. Does this browser hold a WebObsidian session opened by the Hub?
    # 204 yes / 401 no. WebObsidian only accepts that kind of session here — not a
    # password session, not the trusted-proxy header (which is cleared anyway).
    location = /_webobsidian_hub_session {
        internal;
        proxy_pass http://127.0.0.1:18787/auth/hub/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-WebObsidian-Proxy-Auth "";
        proxy_set_header Authorization "";
    }

    location / {
        # [hub] 1. Either the Basic Auth login (unchanged) or a Hub session cookie.
        satisfy any;
        auth_request /_webobsidian_hub_session;

        proxy_pass http://127.0.0.1:18787;
        proxy_http_version 1.1;
        include /etc/nginx/snippets/obsidian-proxy-auth.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 3003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
